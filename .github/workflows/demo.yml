name: Demo

# Builds the static showcase and publishes it to GitHub Pages, which serves it at
# https://demo.aiti.pw (custom domain; repo Settings → Pages → Source: GitHub
# Actions, CNAME recorded in public/CNAME).
#
# The build needs the aiti-ai source tree: the UI is synced from it and the
# extension tier is copied from its packages. It is checked out next to this repo
# and pointed at with AITI_SRC.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "mock/**"
      - "scripts/**"
      - "capture/**"
      - "extensions/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "app/**"
      - "mock/**"
      - "scripts/**"
      - "capture/**"
      - "extensions/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes nothing (never cancel a deploy
# halfway through the artifact upload).
concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AITI_SRC: ${{ github.workspace }}/aiti-ai
      # Custom domain serves from the root: no base path for the export.
      PAGES_BASE_PATH: ""
      # A fresh aiti-ai clone has no built extension dists (they are build
      # artifacts), so take the client bundles from each extension's published
      # npm tarball instead of its checkout. Extensions that are bundled-only
      # (not on npm) still appear in the catalog, just without a client.
      AITI_DIST_SOURCE: npm
    steps:
      - uses: actions/checkout@v4
      - name: Check out aiti-ai (frontend + extension source)
        uses: actions/checkout@v4
        with:
          repository: aiti-ai/aiti-ai
          path: aiti-ai
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      # `npm install`, not `npm ci`: npm's own validation of the optional
      # @tailwindcss/oxide-wasm32-wasi subtree disagrees between npm minors
      # ("Missing: @emnapi/runtime" on the runner while the very same lock
      # installs cleanly locally). The lockfile still pins every version; this
      # step only lets npm repair that subtree instead of refusing to install.
      - run: npm install --no-audit --no-fund
      # prebuild: sync the UI from aiti-ai, rebuild the extension tier, snapshot
      # the repository files for the explorer, then next build → out/
      - run: npm run build
      - name: Fixture / secret audit
        run: npm run audit
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Static-site tour (smoke test)
        run: npm run tour
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    # Deploy only from main (pull requests build but never publish).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
