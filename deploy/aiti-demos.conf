# demo.aiti.pw — static showcase (aiti-demos build)
server {
    listen 80;
    listen [::]:80;
    server_name demo.aiti.pw;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.aiti.pw;

    ssl_certificate     /etc/letsencrypt/live/aiti.pw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiti.pw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/aiti-demos;
    index index.html;
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2;

    # NB: a location that sets add_header drops the inherited ones, so every
    # block below repeats nosniff.
    add_header X-Content-Type-Options nosniff always;

    # nginx's shipped mime.types has no .mjs entry; the build's extension
    # clients are ES modules. (Regex locations win over prefix ones, so this
    # also handles /api/extensions/**.mjs — keep its cache policy in sync.)
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Hashed build output: never changes under the same URL.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The demo's backend is a static fixture tree: recorded /api/* responses and
    # extension client bundles. Names are content-addressed (hash file names or
    # ?rev=<hash>) but a redeploy does reuse some paths, so: short TTL, then
    # revalidate. Without this every reload re-requested ~30 extension assets.
    location /api/ {
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # File snapshot behind the editor/file explorer (71MB; one file per entry).
    location /demo-files/ {
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Static artwork (app icon, provider marks).
    location ~* ^/(icons/|provider-icons\.svg) {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
